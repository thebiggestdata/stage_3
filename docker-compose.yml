networks:
  search_net:
    driver: bridge

services:

  activemq:
    container_name: activemq
    image: rmohr/activemq:latest
    restart: always
    environment:
      - ACTIVEMQ_ADMIN_LOGIN=admin
      - ACTIVEMQ_ADMIN_PASSWORD=admin
    ports:
      - "61616:61616"
      - "8161:8161"
    networks:
      - search_net
    profiles:
      - broker

  ingestion-service:
    container_name: ingestion-service
    build:
      context: ./ingestion-service
    image: ingestion-service:latest
    command: ['datalake']
    environment:
      HZ_PORT: "5701"
      HZ_PUBLIC_ADDRESS: ${NODE_IP}:5701
      HZ_MEMBERS: ${MASTER_IP}:5701
      HAZELCAST_CLUSTER_NAME: SearchEngine
      BROKER_URL: tcp://${MASTER_IP}:61616
      REPLICATION_FACTOR: 2
      INDEXING_BUFFER_FACTOR: 2
    ports:
      - "5701:5701"
    volumes:
      - ./mnt/datalake:/app/datalake
    networks:
      - search_net
    profiles:
      - backend

  indexing-service:
    container_name: indexing-service
    build:
      context: ./indexing-service
    image: indexing-service:latest
    command: ['datalake']
    environment:
      HZ_PORT: "5702"
      HZ_PUBLIC_ADDRESS: ${NODE_IP}:5702
      HZ_MEMBERS: ${MASTER_IP}:5701
      HAZELCAST_CLUSTER_NAME: SearchEngine
      BROKER_URL: tcp://${MASTER_IP}:61616
    ports:
      - "5702:5702"
    volumes:
      - ./mnt/datalake:/app/datalake
    networks:
      - search_net
    profiles:
      - backend

  search-service:
    container_name: search-service
    build:
      context: ./search-service
    image: search-service:latest
    environment:
      HZ_PORT: "5703"
      SERVICE_PORT: "7003"
      HZ_PUBLIC_ADDRESS: ${NODE_IP}:5703
      HZ_MEMBERS: ${MASTER_IP}:5701
      HAZELCAST_CLUSTER_NAME: SearchEngine
      SORTING_CRITERIA: "frequency"
    ports:
      - "5703:5703"
      - "7003:7003"
    networks:
      - search_net
    profiles:
      - backend

  benchmark:
    container_name: benchmark
    build:
      context: ./benchmarking
    image: benchmark:latest
    command: ['datalake']
    environment:
      BENCHMARK_MODE: recoverytime
      HZ_PORT: "5704"
      HZ_PUBLIC_ADDRESS: ${NODE_IP}:5704
      HZ_MEMBERS: ${MASTER_IP}:5701
      HAZELCAST_CLUSTER_NAME: SearchEngine
    ports:
      - "5704:5704"
    networks:
      - search_net
    profiles:
      - benchmark

  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - search_net
    profiles:
      - loadbalancer