services:
  ingestion-service:
    build:
      context: ./ingestion-service
    image: ingestion-service:latest
    ports:
      - "5701:5701"
      - "7001:7001"
    command: ['datalake']
    environment:
      HZ_PORT: "5701"
      HZ_PUBLIC_ADDRESS: ${HZ_PUBLIC_ADDRESS:-ingestion-service}:5701
      HZ_MEMBERS: ${MASTER_IP:-ingestion-service}:5701
      HAZELCAST_CLUSTER_NAME: SearchEngine
      HAZELCAST_BACKUP_COUNT: ${HAZELCAST_BACKUP_COUNT:-2}
      BROKER_URL: tcp://${MASTER_IP:-activemq}:61616
      REPLICATION_FACTOR: ${REPLICATION_FACTOR:-2}
      INDEXING_BUFFER_FACTOR: ${INDEXING_BUFFER_FACTOR:-20}
      INGESTION_WORKERS: ${INGESTION_WORKERS:-4}
      SERVICE_PORT: "7001"
    volumes:
      - ./mnt/datalake:/app/datalake
    networks:
      - search_net
    profiles:
      - backend

  indexing-service:
    build:
      context: ./indexing-service
    image: indexing-service:latest
    ports:
      - "5702:5702"
      - "7002:7002"
    command: ['datalake']
    environment:
      HZ_PORT: "5702"
      HZ_PUBLIC_ADDRESS: ${HZ_PUBLIC_ADDRESS:-indexing-service}:5702
      HZ_MEMBERS: ${MASTER_IP:-ingestion-service}:5701
      HAZELCAST_CLUSTER_NAME: SearchEngine
      HAZELCAST_BACKUP_COUNT: ${HAZELCAST_BACKUP_COUNT:-2}
      BROKER_URL: tcp://${MASTER_IP:-activemq}:61616
      SERVICE_PORT: "7002"
      INDEXING_CONSUMERS: ${INDEXING_CONSUMERS:-2}
      INDEX_WRITERS: ${INDEX_WRITERS:-4}
      ACTIVEMQ_PREFETCH: ${ACTIVEMQ_PREFETCH:-1}
      ACTIVEMQ_MAX_REDELIVERIES: ${ACTIVEMQ_MAX_REDELIVERIES:-50}
      ACK_UNRECOVERABLE_DATALAKE_MISS: ${ACK_UNRECOVERABLE_DATALAKE_MISS:-true}
      LAST_BOOK_ID: ${LAST_BOOK_ID:-100000}
    volumes:
      - ./mnt/datalake:/app/datalake
    networks:
      - search_net
    profiles:
      - backend

  search-service:
    build:
      context: ./search-service
    image: search-service:latest
    ports:
      - "5703:5703"
      - "7003:7003"
    environment:
      HZ_PORT: "5703"
      SERVICE_PORT: "7003"
      HZ_PUBLIC_ADDRESS: ${HZ_PUBLIC_ADDRESS:-search-service}:5703
      HZ_MEMBERS: ${MASTER_IP:-ingestion-service}:5701
      HAZELCAST_CLUSTER_NAME: SearchEngine
      HAZELCAST_BACKUP_COUNT: ${HAZELCAST_BACKUP_COUNT:-2}
      SORTING_CRITERIA: "frequency"
    networks:
      - search_net
    profiles:
      - backend

  benchmark:
    build:
      context: ./benchmarking
    image: benchmark:latest
    environment:
      BENCHMARK_MODE: ${BENCHMARK_MODE:-recoverytime}
      HZ_MEMBERS: ${MASTER_IP:-ingestion-service}:5701
      HAZELCAST_CLUSTER_NAME: SearchEngine
    networks:
      - search_net
    profiles:
      - benchmark

  activemq:
    image: rmohr/activemq:latest
    restart: always
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      - ACTIVEMQ_ADMIN_LOGIN=admin
      - ACTIVEMQ_ADMIN_PASSWORD=admin
    networks:
      - search_net
    profiles:
      - broker

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ${NGINX_CONFIG:-./nginx.conf}:/etc/nginx/nginx.conf:ro
    networks:
      - search_net
    profiles:
      - loadbalancer

networks:
  search_net:
    driver: bridge
